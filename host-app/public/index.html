<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopSphere — Microfrontend Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --ink: #1a1a2e;
        --ink-soft: #4a4a6a;
        --surface: #f7f7fb;
        --white: #ffffff;
        --accent: #6c63ff;
        --accent-soft: #ede9ff;
        --danger: #ff4757;
        --success: #2ed573;
        --border: #e8e8f0;
      }
      html { font-family: 'Inter', sans-serif; background: var(--surface); color: var(--ink); }
      body { min-height: 100vh; overflow-x: hidden; }
      #root { min-height: 100vh; width: 100%; max-width: 100%; overflow-x: clip; }
      img, svg, video { max-width: 100%; height: auto; }
      @media (max-width: 420px) { body { font-size: 15px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
